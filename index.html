:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172d3c;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1150px;margin:auto;padding:28px 20px 70px}header{display:flex;justify-content:space-between;gap:20px;align-items:start}h1{font-size:clamp(26px,4vw,42px);margin:7px 0}h2{font-size:22px}p{line-height:1.55}.sub,.muted{color:#5c7180}.tag{font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:800;color:#087e83}.lang{display:flex;background:#e2ebee;border-radius:9px;padding:4px}.lang button{border:0;background:none;padding:10px 15px;border-radius:7px;cursor:pointer}.lang button.active{background:#fff;box-shadow:0 1px 5px #b8c6ca}.tabs{display:flex;gap:9px;margin:28px 0 18px}.tabs button{border:1px solid #d3e0e5;background:#fff;padding:11px 20px;border-radius:9px;cursor:pointer}.tabs button.active{background:#115c70;color:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat,.panel,.response{background:#fff;border:1px solid #dce6ea;border-radius:13px;padding:20px}.stat b{font-size:31px;display:block}.stat span{color:#607480;font-size:13px}.controls{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin:18px 0}input,select{width:100%;padding:14px;border:1px solid #bdcfd5;border-radius:9px;font:inherit;background:white}.response{margin:11px 0}.response .id{font-size:12px;color:#738895;font-weight:700}.response p{white-space:pre-wrap;margin:10px 0 0}.panel{margin:14px 0}.bars{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:38px 1fr 45px;gap:12px;align-items:center}.track{height:12px;border-radius:20px;background:#e3eef0;overflow:hidden}.fill{height:100%;background:#168a8a}.theme{padding:12px 0;border-bottom:1px solid #e3eaee}.theme:last-child{border:0}.notice{background:#fff4e5;border-left:4px solid #d48a27;padding:14px 18px;border-radius:6px;margin:18px 0;font-size:14px}footer{margin-top:30px;font-size:13px;color:#607480}#analysis{display:none}@media(max-width:650px){header{flex-direction:column}.controls{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:13px}.stat b{font-size:24px}}
</style></head><body><main class="wrap"><header><div><div class="tag">NVR / RNV · TOURS 2026</div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div class="lang"><button id="frBtn" onclick="setLang('fr')">FR</button><button id="enBtn" onclick="setLang('en')">EN</button></div></header><div class="notice" id="privacy"></div><div class="stats" id="stats"></div><nav class="tabs"><button id="browseTab" onclick="setTab('browse')"></button><button id="analysisTab" onclick="setTab('analysis')"></button></nav><section id="browse"><div class="controls"><select id="q" onchange="renderResponses()"></select><input id="search" oninput="renderResponses()" /></div><div class="muted" id="count"></div><div id="results"></div></section><section id="analysis"><div class="panel"><h2 id="quant"></h2><p class="muted" id="quantDesc"></p><div class="bars" id="bars"></div></div><div class="panel"><h2 id="qual"></h2><p class="muted" id="qualDesc"></p><div id="themes"></div></div></section><footer id="foot"></footer></main><script>
const Q={fr:['Effets des événements sociopolitiques sur la pratique','Expérience de protestation non violente','Articulation entre RNV et action institutionnelle','Identité professionnelle et RNV sociopolitique'],en:['Effects of sociopolitical events on practice','Experience of nonviolent protest','Connecting NVR with institutional action','Professional identity and sociopolitical NVR']};
const T={fr:{title:'La pratique de la politique',subtitle:'RNV des aidants et RNV sociopolitique · Réponses au questionnaire préparatoire',privacy:'VERSION DE RÉVISION — Contient des réponses originales non expurgées. Ne pas publier sur GitHub Pages avant vérification des données personnelles et des détails cliniques.',respondents:'Soumissions',questions:'Questions',answers:'Réponses renseignées',browse:'Explorer les réponses',analysis:'Analyse',all:'Toutes les questions',search:'Rechercher dans les réponses…',result:'réponse(s) trouvée(s)',q:'Question',quant:'Participation par question',quantDesc:'Nombre de réponses non vides sur 19 soumissions. Les réponses très brèves (« non », « nan ») sont comptées comme réponses.',qual:'Premières observations qualitatives',qualDesc:'Lecture exploratoire, non exhaustive. Ces thèmes ne sont pas des catégories mutuellement exclusives ni des résultats d’un codage formalisé.',foot:'Les réponses sont présentées en français dans l’onglet FR et en traduction anglaise dans l’onglet EN. Les réponses initialement rédigées en anglais restent en anglais.',themes:[['La RNV comme posture éthique','Plusieurs participants présentent la non-violence comme une posture qui dépasse le travail clinique et s’étend à la vie citoyenne.'],['Présence collective et désescalade','Les récits de manifestations soulignent la force du collectif, la présence durable, le dialogue, mais aussi la peur de l’escalade.'],['Institutions, droits et coopération','Des réponses évoquent l’école, les services et les institutions comme lieux où soutenir les familles sans rompre le dialogue.'],['Réserves et incertitudes','Plusieurs répondants ne se disent pas suffisamment formés à la RNV ou distinguent la pratique clinique de l’engagement politique.']]},en:{title:'The Practice of Politics',subtitle:'Caregiver NVR and sociopolitical NVR · Pre-workshop questionnaire responses',privacy:'REVIEW VERSION — Contains unredacted original responses. Do not publish on GitHub Pages until personal information and clinical details have been reviewed.',respondents:'Submissions',questions:'Questions',answers:'Answered fields',browse:'Explore responses',analysis:'Analysis',all:'All questions',search:'Search responses…',result:'matching answer(s)',q:'Question',quant:'Participation by question',quantDesc:'Number of non-empty answers out of 19 submissions. Very short answers (e.g., “non”) count as answered.',qual:'Initial qualitative observations',qualDesc:'Exploratory, non-exhaustive reading. Themes are neither mutually exclusive nor the results of formal coding.',foot:'English view shows English translations of French responses and retains answers originally written in English. Translations have not been verified by respondents.',themes:[['NVR as an ethical stance','Several respondents describe nonviolence as a stance extending beyond clinical practice into civic life.'],['Collective presence and de-escalation','Protest accounts highlight collective strength, sustained presence and dialogue, but also fear of escalation.'],['Institutions, rights and cooperation','Responses mention schools, services and institutions as places to advocate for families while maintaining dialogue.'],['Reservations and uncertainty','Some respondents say they have insufficient NVR training or distinguish clinical work from political engagement.']]}};
let data=[],lang='fr',tab='browse';const el=id=>document.getElementById(id);function setLang(x){lang=x;render()}function setTab(x){tab=x;render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.documentElement.lang=lang;const t=T[lang];el('title').textContent=t.title;el('subtitle').textContent=t.subtitle;el('privacy').textContent=t.privacy;el('foot').textContent=t.foot;el('frBtn').classList.toggle('active',lang==='fr');el('enBtn').classList.toggle('active',lang==='en');el('browseTab').textContent=t.browse;el('analysisTab').textContent=t.analysis;el('browseTab').classList.toggle('active',tab==='browse');el('analysisTab').classList.toggle('active',tab==='analysis');el('browse').style.display=tab==='browse'?'block':'none';el('analysis').style.display=tab==='analysis'?'block':'none';const n=data.reduce((a,r)=>a+r.answers.filter(Boolean).length,0);el('stats').innerHTML=[[data.length,t.respondents],[4,t.questions],[n,t.answers]].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');const prev=el('q').value||'all';el('q').innerHTML=`<option value="all">${t.all}</option>`+Q[lang].map((x,i)=>`<option value="${i}">Q${i+1} · ${esc(x)}</option>`).join('');el('q').value=prev;el('search').placeholder=t.search;el('quant').textContent=t.quant;el('quantDesc').textContent=t.quantDesc;el('qual').textContent=t.qual;el('qualDesc').textContent=t.qualDesc;el('themes').innerHTML=t.themes.map(([a,b])=>`<div class="theme"><strong>${esc(a)}</strong><p>${esc(b)}</p></div>`).join('');el('bars').innerHTML=Q[lang].map((x,i)=>{const n=data.filter(r=>r.answers[i]).length;return `<div class="barrow"><strong>Q${i+1}</strong><div class="track" title="${esc(x)}"><div class="fill" style="width:${data.length?100*n/data.length:0}%"></div></div><span>${n}/${data.length}</span></div>`}).join('');renderResponses()}
function renderResponses(){const q=el('q').value,s=el('search').value.trim().toLocaleLowerCase();let found=[];for(const r of data)r.answers.forEach((original,i)=>{const a=lang==='en'?(r.answers_en?.[i]??original):original;if(a&&(q==='all'||+q===i)&&(!s||a.toLocaleLowerCase().includes(s)||original.toLocaleLowerCase().includes(s)||Q[lang][i].toLocaleLowerCase().includes(s)))found.push({id:r.id,q:i,a})});el('count').textContent=`${found.length} ${T[lang].result}`;el('results').innerHTML=found.map(r=>`<article class="response"><div class="id">#${r.id} · Q${r.q+1} · ${esc(Q[lang][r.q])}</div><p>${esc(r.a)}</p></article>`).join('')}
fetch('responses.json').then(r=>r.json()).then(x=>{data=x;render()}).catch(()=>{el('privacy').textContent='Please serve this folder through a local web server (python -m http.server 8000).'});
</script></body></html>
